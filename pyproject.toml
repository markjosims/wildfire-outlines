[project]
name = "wildfire-outlines"
version = "0.1.0"
description = "Assessment app for A4CPL for FIRETEK 207"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.8",
    "botocore[crt]>=1.43.8",
    "dotenv>=0.9.9",
    "openai>=2.36.0",
    "outlines>=1.3.0",
    "pydantic>=2.13.4",
    "sqlmodel>=0.0.38",
    "streamlit>=1.57.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
